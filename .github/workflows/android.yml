name: Android

# Builds the Android APK and runs it once on an emulator.
#
# This workflow belongs to the Android port. It builds the same Rust core
# and React frontend as the desktop app through Tauri's Android target
# (apps/desktop/src-tauri/gen/android), for two ABIs: arm64-v8a, which is
# what phones and tablets run, and x86_64, which is what the emulator on a
# hosted runner runs. The `smoke` job then installs the x86_64 build on an
# emulator and drives the real app (scripts/ci/android-smoke.sh).
#
# Linux runners only: nothing here needs macOS or Windows.

on:
  push:
    # `main` only. A branch is built by its pull request below: building it
    # on the push as well ran every commit twice, and this repository's
    # Actions minutes are metered.
    branches: [main]
    paths:
      - apps/desktop/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - pnpm-lock.yaml
      - rust-toolchain.toml
      - scripts/ci/android-smoke.sh
      - scripts/ci/android-smoke.mjs
      - .github/workflows/android.yml
  pull_request:
    paths:
      - apps/desktop/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - pnpm-lock.yaml
      - rust-toolchain.toml
      - scripts/ci/android-smoke.sh
      - scripts/ci/android-smoke.mjs
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  # No debug info: the debug APK keeps whatever symbols the libraries carry
  # (app/build.gradle.kts), and with full DWARF the Rust library alone is
  # hundreds of megabytes.
  CARGO_PROFILE_DEV_DEBUG: 0
  # The DSP, the decoders and the ML pre-processing are unusable
  # unoptimised, and the smoke test renders and decodes real audio.
  CARGO_PROFILE_DEV_OPT_LEVEL: 2

jobs:
  apk:
    name: apk (arm64-v8a, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The runner image carries the Android SDK and an NDK; Tauri's CLI
      # reads NDK_HOME.
      - name: Point NDK_HOME at the runner's NDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          test -d "$ndk"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Install Rust toolchain (rust-toolchain.toml) and Android targets
        run: |
          rustup show active-toolchain
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: android
          cache-on-failure: true

      - name: pnpm install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the APK
        run: pnpm --filter @edytlab/desktop tauri android build --apk --debug --target aarch64 x86_64 --ci

      - name: Collect the APK
        run: |
          mkdir -p apk-out
          find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -exec cp {} apk-out/ \;
          ls -la apk-out
          test -n "$(ls apk-out/*.apk)"

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: edytlab-android-debug
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: smoke (emulator)
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the APK
        uses: actions/download-artifact@v8
        with:
          name: edytlab-android-debug
          path: apk-out

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The emulator makes its data partition as a file on the runner, and
      # refuses to start without room for all of it. The image's toolchains
      # this job never uses are the quickest room to make.
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      # Hardware acceleration for the emulator, as the action's readme asks.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          ram-size: 4096M
          # The app, its unpacked libraries and a few seconds of audio.
          disk-size: 3G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/ci/android-smoke.sh apk-out

      - name: Upload what the run left behind
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-smoke
          path: smoke-out/
          if-no-files-found: warn
          retention-days: 14
